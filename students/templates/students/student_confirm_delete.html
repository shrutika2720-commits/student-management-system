{% extends 'students/base.html' %}
{% block title %}Delete Student{% endblock %}
{% block content %}
  <h1>Delete {{ object }}</h1>
  <p>Are you sure?</p>
  <form method="post">{% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>
  <p><a href="{{ object.get_absolute_url }}">No, go back</a></p>
{% endblock %}
